name: Build & Release QuantumVPN

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev openvpn

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Desktop
        run: |
          flutter build linux --release
          cd build/linux/x64/release/bundle
          tar -czvf /tmp/quantum-vpn-linux-x64.tar.gz *

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-vpn-linux-x64
          path: /tmp/quantum-vpn-linux-x64.tar.gz
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/quantum-vpn-universal-release.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantum-vpn-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: quantum-vpn-linux-x64
          path: release-assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: quantum-vpn-android-apks
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QuantumVPN ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🛡️ QuantumVPN ${{ github.ref_name }} - Next-Gen Stealth Bypass & Free VPN Suite

            ### 🚀 Что нового в ${{ github.ref_name }}:
            - **⚡ Quantum Stealth Engine (Xray-Core)**: Интегрировано высокоскоростное ядро обхода блокировок нового поколения.
              - Поддержка протоколов **VLESS Reality** (маскировка TLS-отпечатков под Chrome/Safari, устойчивость к ТСПУ и глубокому анализу DPI).
              - Поддержка **Shadowsocks 2022 / AEAD** и **Trojan TLS** со сверхбыстрым откликом (400–600 мс).
              - Гарантированная смена внешнего IP-адреса с валидацией в реальном времени перед установкой соединения.
              - Встроенный каталог проверенных серверов из 30+ стран с автоматическим обновлением из облака.
            - **🌐 Системная маршрутизация и защита DNS**:
              - Автоматическая настройка системного прокси Linux (HTTP и SOCKS5) для прозрачной работы всех браузеров и приложений.
              - Безопасный аварийный сброс сетевых параметров и восстановление DNS при выходе.
            - **✨ Antigravity Tool Manager**: Панель управления и обхода региональных ограничений для Antigravity CLI и IDE.
            - **🤖 Стабильность Android**: Оптимизация сборки APK, поддержка VpnService и правила ProGuard для предотвращения сбоев R8.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build & Release QuantumVPN

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev openvpn

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Desktop
        run: |
          flutter build linux --release
          cd build/linux/x64/release/bundle
          tar -czvf /tmp/quantum-vpn-linux-x64.tar.gz *

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-vpn-linux-x64
          path: /tmp/quantum-vpn-linux-x64.tar.gz
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/quantum-vpn-universal-release.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantum-vpn-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: quantum-vpn-linux-x64
          path: release-assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: quantum-vpn-android-apks
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QuantumVPN ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🛡️ QuantumVPN ${{ github.ref_name }} - Free OpenVPN Client & Antigravity Suite
            
            ### 🚀 Что нового в ${{ github.ref_name }}:
            - **✨ Antigravity Tool Manager**: Интегрированная панель управления и обхода региональных ограничений для Antigravity (Antigravity IDE, Antigravity 2.0 Desktop Hub, Antigravity CLI `agy`).
              - Автоматическое обнаружение установленных бинарников в системе.
              - 1-клик патчинг с помощью встроенного движка `ag-cleaner` (нейтрализация проверок геолокации и language_server).
              - Безопасный запуск без телеметрии (`ANTIGRAVITY_DISABLE_TELEMETRY=true`).
            - **⚡ Исправление таймаутов OpenVPN (Linux)**: Увеличен тайм-аут ожидания ответа сервера и согласования маршрутов (`PUSH_REQUEST`), исключающий ложные обрывы при подключении к загруженным серверам.
            - **🤖 Исправление Android NoSuchMethodError**: Добавлены правила ProGuard и защита SharedPreferences от минификации R8 при релизной сборке APK.
            - **🛡️ Защита DNS и сети**: Улучшенный сброс системного DNS и маршрутов при аварийном завершении приложения.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
